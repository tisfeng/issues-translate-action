name: 'Issues and PRs Translator'
description: 'The action for translating issues, PR conversation comments, and PR review comments between configured languages.'
branding:
  icon: 'disc'
  color: 'orange'
author: 'tisfeng'
inputs:
  BOT_GITHUB_TOKEN:
    description: 'Optional custom bot token. Overrides the workflow token. No built-in bot credential is provided.'
    required: false
  github-token:
    description: 'Workflow token used when BOT_GITHUB_TOKEN is empty. Custom credentials should use BOT_GITHUB_TOKEN.'
    default: '${{ github.token }}'
    required: false
  BOT_LOGIN_NAME:
    description: 'Optional bot login. Defaults to github-actions[bot] for the workflow token; resolved via GET /user for a custom PAT. Required for a custom GitHub App token.'
  IS_MODIFY_TITLE: 
    description: 'Is need modify issue title, true or false, default false.'
  CUSTOM_BOT_NOTE:
    description: 'Custom bot note message.'
  PRIMARY_LANGUAGE:
    description: 'Preferred target language for content not written in this language.'
    required: false
    default: 'en'
  SECONDARY_LANGUAGE:
    description: 'Optional target language for content already written in PRIMARY_LANGUAGE.'
    required: false
    default: ''
runs:
  using: 'node24'
  main: 'dist/index.js'
