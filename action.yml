name: 'Issues and PRs Translator'
description: 'The action for translating non-English issues, PR conversation comments, and PR review comments to English.'
branding:
  icon: 'disc'
  color: 'orange'
author: 'tisfeng'
inputs:
  BOT_GITHUB_TOKEN: 
    description: 'The issue comment bot GITHUB_TOKEN.'
  BOT_LOGIN_NAME:
    description: 'The issue comment bot github login name.'
  IS_MODIFY_TITLE: 
    description: 'Is need modify issue title, true or false, default false.'
  CUSTOM_BOT_NOTE:
    description: 'Custom bot note message.'
runs:
  using: 'node24'
  main: 'dist/index.js'
